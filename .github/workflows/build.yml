name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check manifest version matches tag (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(node -p "require('./extension/manifest.json').version")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::tag v$TAG != manifest version $MANIFEST"
            exit 1
          fi

      - name: Syntax-check all extension JS
        run: find extension -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Verify license module (packaged copy)
        run: node tools/verify-license.mjs extension

      - name: Zip extension
        run: |
          mkdir -p dist
          cd extension
          zip -qr ../dist/vid-studio-${GITHUB_REF_NAME:-dev}.zip .
          cd ..
          sha256sum dist/*.zip > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: vid-studio-zip
          path: dist/

      - name: Create GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vid-studio-*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
